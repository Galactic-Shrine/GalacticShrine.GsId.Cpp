name: CMake

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configurer
        run: cmake -S . -B build -DGSID_BUILD_TESTS=ON -DGSID_BUILD_EXAMPLES=ON

      - name: Compiler
        run: cmake --build build --config Release

      - name: Tester
        run: ctest --test-dir build -C Release --output-on-failure
